# OPA Agent — gitleaks config for SCM / Security runs.
# Extends defaults; allowlists common UI false positives (object keys named
# "key", React key= props) without silencing real credential rules.
title = "OPA Agent AppSec"

[extend]
useDefault = true

# Frontend object-literal `key: '…'` / JSX `key=` FPs for generic-api-key only.
# Real secrets in .env / backend / high-entropy tokens still fail other rules.
[[allowlists]]
description = "UI object key / React key prop false positives (generic-api-key)"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''(?i)(?:^|[,\s{([])['"]?key['"]?\s*:''',
  '''(?i)(?:^|[,\s{([])['"]?keys?['"]?\s*:''',
  '''(?i)\skey\s*=\s*\{?['"`]''',
  '''(?i)Object\.keys\s*\(''',
  '''(?i)(?:apiKey|api_key|secretKey|secret_key)\s*:\s*(?:undefined|null|['"`]\s*['"`]|process\.env)''',
]
paths = [
  '''(?i)\.(jsx?|tsx?|vue|svelte|css|scss|less|mjs|cjs)$''',
  '''(?i)/(src|components|pages|ui|dashboard|public|static|assets)/''',
]

[[allowlists]]
description = "Ignore lockfiles and generated bundles"
paths = [
  '''(?i)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|composer\.lock|go\.sum)$''',
  '''(?i)/(dist|build|coverage|\.next|node_modules|vendor)/''',
]
